server {
    listen 80 default_server;
    root /usr/share/nginx/html;

    # index.html — always revalidate so browsers pick up new hashed JS/CSS
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        add_header Expires "0";
    }

    # preload-theme.js — same; can change between deploys
    location = /preload-theme.js {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # Hashed assets (Vite): cache aggressively — filename changes on every build
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Everything else (favicons, manifest, etc.)
    location / {
        try_files $uri /index.html;
        add_header Cache-Control "no-cache";
    }
}
